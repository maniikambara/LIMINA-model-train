name: Fetch Sectors API -> Supabase

# Jalur TULIS: mengambil data mentah dari Sectors API v2 lalu
# menyimpannya ke Supabase lewat `python -m sectors_fetcher.main`. Ini
# yang mengisi tabel yang dibaca kedua pipeline latih.
#
# NONAKTIF: sectors_fetcher/main.py butuh 6 modul storage/save_*.py
# (jalur TULIS per tabel) yang belum dibuat -- baru SupabaseStorage
# (jalur BACA, dipakai api/) yang sudah ada. Jangan aktifkan jadwalnya
# sebelum keenamnya lengkap.
on:
  schedule:
    - cron: "0 0 31 2 *" # placeholder yang tidak pernah jalan (31 Feb tidak ada)
  workflow_dispatch: {}

concurrency:
  group: fetch-sectors-to-supabase
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SECTORS_API_KEY: ${{ secrets.SECTORS_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instal dependensi
        run: pip install -r requirements.txt

      - name: Cek secrets tersedia
        run: |
          missing=0
          for v in SECTORS_API_KEY SUPABASE_URL SUPABASE_KEY; do
            if [ -z "${!v}" ]; then
              echo "::error::Secret $v belum diset (Settings -> Secrets and variables -> Actions)."
              missing=1
            fi
          done
          if [ "$missing" = "1" ]; then exit 1; fi

      - name: Jalankan fetch Sectors API -> Supabase
        run: python -m sectors_fetcher.main
