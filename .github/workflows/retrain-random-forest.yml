name: Retrain LIMINA - Random Forest (produksi)

# Pipeline produksi: 01_ambil_data -> eda_and_feature_engineering ->
# modeling_and_evaluation, lalu commit balik output/ + ketiga notebook.
# Jalur TULIS (Sectors API -> Supabase) ada di fetch-sectors-to-supabase.yml,
# bukan di sini -- job ini cuma baca tabel Supabase yang sudah terisi.
on:
  schedule:
    - cron: "0 15 * * *" # 22:00 WIB
  workflow_dispatch: {}

concurrency:
  group: retrain-random-forest
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instal dependensi
        run: pip install -r requirements.txt

      # Cuma SUPABASE_URL/KEY -- notebook di bawah tidak memanggil Sectors API.
      - name: Cek secrets tersedia
        run: |
          missing=0
          for v in SUPABASE_URL SUPABASE_KEY; do
            if [ -z "${!v}" ]; then
              echo "::error::Secret $v belum diset."
              missing=1
            fi
          done
          if [ "$missing" = "1" ]; then exit 1; fi

      - name: Jalankan 01_ambil_data.ipynb
        run: |
          jupyter nbconvert --to notebook --execute --inplace \
            --ExecutePreprocessor.kernel_name=python3 \
            --ExecutePreprocessor.timeout=1200 \
            preprocessing/notebook/01_ambil_data.ipynb

      - name: Jalankan eda_and_feature_engineering.ipynb
        run: |
          jupyter nbconvert --to notebook --execute --inplace \
            --ExecutePreprocessor.kernel_name=python3 \
            --ExecutePreprocessor.timeout=1200 \
            preprocessing/notebook/eda_and_feature_engineering.ipynb

      - name: Jalankan modeling_and_evaluation.ipynb
        run: |
          jupyter nbconvert --to notebook --execute --inplace \
            --ExecutePreprocessor.kernel_name=python3 \
            --ExecutePreprocessor.timeout=1200 \
            preprocessing/notebook/modeling_and_evaluation.ipynb

      # Commit hanya kalau ketiga notebook sukses (tidak pakai if: always()).
      - name: Commit output (model + dataset + skor)
        run: |
          git config user.name "limina-bot"
          git config user.email "limina-bot@users.noreply.github.com"
          git add output/
          git add preprocessing/notebook/01_ambil_data.ipynb \
                  preprocessing/notebook/eda_and_feature_engineering.ipynb \
                  preprocessing/notebook/modeling_and_evaluation.ipynb
          git diff --staged --quiet || git commit -m "Perbarui model dan output pipeline produksi ($(date -u +%Y-%m-%d))"
          git push

      - name: Unggah artefak (untuk diagnosis kalau gagal)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: random-forest-run-${{ github.run_number }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            preprocessing/notebook/01_ambil_data.ipynb
            preprocessing/notebook/eda_and_feature_engineering.ipynb
            preprocessing/notebook/modeling_and_evaluation.ipynb
            output/
