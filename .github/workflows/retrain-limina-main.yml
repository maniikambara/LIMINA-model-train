name: Perbarui model LIMINA (arsip notebooks/01-05)

# NONAKTIF sementara -- hanya retrain-random-forest.yml yang jalan
# otomatis untuk saat ini. Jadwal cron di bawah sengaja dilepas supaya
# workflow ini TIDAK jalan sendiri; masih bisa dipicu manual lewat tab
# Actions -> workflow ini -> "Run workflow" kalau perlu. Untuk
# mengaktifkan lagi jadwal hariannya, kembalikan blok schedule:
#   schedule:
#     - cron: "0 22 * * *"
#
# Pipeline PRODUKSI ada di retrain-random-forest.yml
# (sectors_fetcher/ + preprocessing/notebook/) -- lihat README bagian
# "Dua pipeline" untuk status masing-masing.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  perbarui-model:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pasang dependensi
        run: pip install -r requirements.txt

      - name: 01 - Ambil data
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: jupyter nbconvert --to notebook --execute --inplace notebooks/01_ambil_data.ipynb

      - name: 02 - Preprocessing dan normalisasi
        run: jupyter nbconvert --to notebook --execute --inplace notebooks/02_preprocessing_dan_normalisasi.ipynb

      - name: 03 - Pelatihan model
        run: jupyter nbconvert --to notebook --execute --inplace notebooks/03_pelatihan_model.ipynb

      - name: 04 - Evaluasi model
        run: jupyter nbconvert --to notebook --execute --inplace notebooks/04_evaluasi_model.ipynb

      - name: 05 - Penilaian dan artefak
        run: jupyter nbconvert --to notebook --execute --inplace notebooks/05_penilaian_dan_artefak.ipynb

      - name: Commit artefak yang diperbarui
        run: |
          git config user.name "limina-bot"
          git config user.email "limina-bot@users.noreply.github.com"
          # -f perlu karena keempat berkas ini masuk .gitignore. Dicek satu
          # per satu dulu -- backtest.json/ringkasan_evaluasi.md hanya ada
          # kalau Kandidat 1 sudah berhasil dilatih (lihat notebook 04),
          # jadi belum tentu ada tiap siklus.
          for berkas in artifacts/scores.json artifacts/backtest.json artifacts/ringkasan_evaluasi.md artifacts/riwayat_skor.csv; do
            [ -f "$berkas" ] && git add -f "$berkas"
          done
          git add notebooks/*.ipynb
          git diff --staged --quiet || git commit -m "Perbarui model dan skor otomatis ($(date -u +%Y-%m-%d))"
          git push
