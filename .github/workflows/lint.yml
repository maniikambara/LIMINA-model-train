name: Lint & Cek Sintaks

# NONAKTIF sementara -- hanya retrain-random-forest.yml yang jalan
# otomatis untuk saat ini. Trigger push/pull_request sengaja dilepas;
# masih bisa dipicu manual lewat tab Actions -> workflow ini -> "Run
# workflow". Untuk mengaktifkan lagi supaya jalan di tiap push/PR,
# kembalikan dua trigger ini:
#   push:
#     branches: ["**"]
#   pull_request:
#     branches: ["**"]
on:
  workflow_dispatch: {}

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instal dependensi
        run: pip install -r requirements.txt

      - name: Cek sintaks seluruh modul Python (sectors_fetcher/)
        run: |
          git ls-files '*.py' | xargs -r python -m py_compile

      - name: Cek sintaks seluruh sel kode notebook
        run: |
          python - <<'PY'
          import ast
          import json
          import pathlib
          import sys

          gagal = False
          for path in sorted(pathlib.Path("preprocessing/notebook").glob("*.ipynb")):
              nb = json.loads(path.read_text(encoding="utf-8"))
              for i, cell in enumerate(nb["cells"]):
                  if cell["cell_type"] != "code":
                      continue
                  src = "".join(cell["source"])
                  try:
                      ast.parse(src)
                  except SyntaxError as e:
                      gagal = True
                      print(f"::error file={path}::Sel kode {i}: {e}")
              print(f"OK: {path} ({len(nb['cells'])} sel)")

          sys.exit(1 if gagal else 0)
          PY

      # sectors_fetcher/storage/supabase_client.py (jalur BACA, dipakai
      # AMBAScoringService lewat api/) sudah ada dan diimpor di bawah.
      # main.py TIDAK diimpor di sini -- dia butuh enam modul
      # storage/save_*.py (jalur TULIS, dipanggil fetch-sectors-to-supabase.yml)
      # yang masih belum dibuat (lihat storage/__init__.py). features/pipeline.py
      # sama, belum diimpor karena belum ada di checkout ini.
      - name: Import cepat sectors_fetcher (tanpa kredensial)
        run: |
          python -c "
          import sectors_fetcher
          from sectors_fetcher import config, client, supabase_io, service
          from sectors_fetcher.risk_scorer_fallback import SkorAnomaliMahalanobis
          from sectors_fetcher.features import compliance, financial_health, liquidity_price, ownership
          from sectors_fetcher.storage.supabase_client import SupabaseStorage
          print('Import sectors_fetcher OK, DEFAULT_TICKERS:', len(config.DEFAULT_TICKERS), 'simbol')
          "

      - name: Import cepat api/ (tanpa kredensial)
        run: |
          python -c "
          from api.main import app
          print('Import api.main OK, routes:', [r.path for r in app.routes])
          "
